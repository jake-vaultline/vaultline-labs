# XcodeGen project definition.
#   brew install xcodegen
#   cd app && xcodegen generate && open VaultlineLabsDriveInspector.xcodeproj
#
# Text-first on purpose: the .xcodeproj is generated, never hand-edited, so it
# stays diffable and there's nothing binary to merge.

name: VaultlineLabsDriveInspector

options:
  bundleIdPrefix: com.vaultline.labs
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  VaultlineLabsDriveInspector:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # Logos inlined into the exported report as data URLs.
      - path: Resources/ReportAssets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: VaultlineLabsDriveInspector
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultline.labs.driveinspector
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/VaultlineLabsDriveInspector.entitlements

        # Required for notarization.
        ENABLE_HARDENED_RUNTIME: YES

        # Sandbox is what makes the "no network" claim enforceable. See the
        # entitlements file before changing anything here.
        ENABLE_APP_SANDBOX: YES

        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "13.0"

        DEVELOPMENT_TEAM: "57U2N6J9ZS"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          # No "Apple Development" cert on this machine, only Developer ID —
          # which is the one that matters for distribution anyway. Sign
          # archives with it directly instead of relying on automatic signing
          # to find a cert that isn't there.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
